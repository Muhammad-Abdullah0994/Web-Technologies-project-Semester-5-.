<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Media Page</title>
  <style>
    body {
      background-color: lightgray;
      font-family: Arial, sans-serif;
      margin: 0;
    }

    /* Navigation Bar */
    .nav-bar {
      background-color: navy;
      padding: 10px 20px;
    }

    .nav-bar a {
      color: cyan;
      text-decoration: none;
      font-weight: bold;
    }

    /* Layout Container */
    .main-layout {
      display: flex;
    }

    /* Sidebar Menu */
    .sidebar-menu {
      width: 200px;
      background-color: white;
      padding: 15px;
      border-right: 1px solid gray;
    }

    .sidebar-menu ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .sidebar-menu li a {
      display: block;
      padding: 8px 12px;
      color: darkslategray;
      text-decoration: none;
      margin-bottom: 5px;
    }

    .sidebar-menu li a.current,
    .sidebar-menu li a:hover {
      background-color: blue;
      color: white;
    }

    /* Content Area */
    .content-area {
      flex: 1;
      padding: 20px;
    }

    .header-box {
      background-color: white;
      padding: 15px;
      margin-bottom: 15px;
      border: 1px solid lightgray;
    }

    .stats-group {
      display: flex;
      gap: 15px;
      color: gray;
    }

    .stat-item {
      font-size: 14px;
    }

    /* Schedule Box */
    .schedule-box {
      background-color: white;
      padding: 15px;
      border: 1px solid lightgray;
    }

    .day-heading {
      font-weight: bold;
      background-color: lightgray;
      padding: 8px;
      margin-bottom: 8px;
    }

    .lesson-row {
      padding: 8px;
      border-bottom: 1px solid lightgray;
      color: darkslategray;
    }

    /* Video Box */
    .video-box {
      background-color: white;
      padding: 15px;
      margin-top: 20px;
      max-width: 600px;
      border: 1px solid lightgray;
    }

    .video-player {
      width: 100%;
      height: 300px;
      background-color: black;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .btn {
      padding: 8px 15px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      color: white;
    }

    .btn-save {
      background-color: blue;
    }

    .btn-done {
      background-color: green;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <div class="nav-bar">
    <a href="index.html">Back to Main Page</a>
  </div>

  <div class="main-layout">
    <!-- Sidebar -->
    <div class="sidebar-menu">
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#" class="current">Week 1</a></li>
        <li><a href="#">Week 2</a></li>
        <li><a href="#">Week 3</a></li>
        <li><a href="#">Quizzes</a></li>
        <li><a href="#">Assignments</a></li>
      </ul>
    </div>

    <!-- Content Area -->
    <div class="content-area">
      <div class="header-box">
        <h2>Chemistry - Week 2</h2>
        <div class="stats-group">
          <div class="stat-item">15 Readings</div>
          <div class="stat-item">20 Videos</div>
          <div class="stat-item">35 Assignments</div>
        </div>
      </div>

      <!-- Schedule Box -->
      <div class="schedule-box">
        <div class="day-heading">Wednesday, 4 June</div>
        <div class="lesson-row">Chemical equilibrium</div>
        <div class="lesson-row">Aldehydes and ketones</div>
        <div class="lesson-row">Carboxylic acid</div>
      </div>

      <!-- Video Box -->
      <div class="video-box">
        <h3>Classification of Organic Compounds</h3>
        <div class="video-player">
          <p>Video Player Placeholder</p>
        </div>
        <div class="button-group">
          <button class="btn btn-save">Save Note</button>
          <button class="btn btn-done">Completed</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
