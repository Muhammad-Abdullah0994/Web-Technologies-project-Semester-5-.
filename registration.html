<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ClassBridge Registration</title>
  <style>
    body 
    {
      background-color: lightgray;
      font-family: Arial, sans-serif;
      margin: 0;
    }

    
    .nav-bar 
    {
      background-color: navy;
      padding: 12px 20px;
    }

    .nav-bar a 
    {
      color: cyan;
      text-decoration: none;
      font-weight: bold;
      margin-right: 20px;
    }

    .nav-bar a:hover 
    {
      text-decoration: underline;
    }

    
    .page-container 
    {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    
    .register-card 
    {
      background-color: white;
      display: flex;
      width: 850px;
      border: 1px solid gray;
      border-radius: 8px;
      overflow: hidden;
    }

    
    .left-banner 
    {
      width: 45%;
      position: relative;
      background-color: cadetblue;
    }

    .left-banner img 
    {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .left-banner h2 
    {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      margin: 0;
      font-size: 28px;
      text-align: center;
      width: 90%;
      text-shadow: 1px 1px 4px black;
    }

   
    .right-form 
    {
      width: 55%;
      padding: 40px;
    }

    .form-title 
    {
      font-size: 26px;
      margin-top: 0;
      margin-bottom: 20px;
      color: black;
    }

    
    .field-group 
    {
      margin-bottom: 18px;
    }

    .field-group label 
    {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      color: darkslategray;
    }

    .field-group input 
    {
      width: 100%;
      padding: 10px;
      border: 1px solid gray;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }

    
    .btn-submit 
    {
      width: 100%;
      background-color: navy;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-submit:hover 
    {
      background-color: blue;
    }

    
    .form-footer 
    {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .form-footer a 
    {
      color: blue;
      text-decoration: none;
    }
  </style>
</head>
<body>

    <div class="nav-bar">
    <a href="index.html">Main Page</a>
    <a href="media.html">Media Page</a>
  </div>

  
  <div class="page-container">
    <div class="register-card">
      
        <div class="left-banner">
        
        <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?q=80&w=800" alt="University Campus">
      </div>

      
      <div class="right-form">
        <h1 class="form-title">ClassBridge</h1>

        <form action="#" method="post">
          <div class="field-group">
            <label for="fullname">Name</label>
            <input type="text" id="fullname" placeholder="Your Full Name">
          </div>

          <div class="field-group">
            <label for="email">Email *</label>
            <input type="email" id="email" placeholder="hello@mantine.dev" required>
          </div>

          <div class="field-group">
            <label for="password">Password *</label>
            <input type="password" id="password" placeholder="Your password" required>
          </div>

          <button type="submit" class="btn-submit">Submit</button>
        </form>

        <div class="form-footer">
          <p>Already have an account? <a href="index.html">Go to Main Page</a></p>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
